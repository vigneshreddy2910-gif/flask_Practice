name: Flask CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-test-push:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MONGO_URI: mongodb://localhost:27017/test_student_db
      SECRET_KEY: github-actions-test-secret

    steps:

      # 1. Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Run tests
      - name: Run tests
        run: |
          pytest

      # 5. Configure AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # 6. Login to Amazon ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 7. Build Docker image
      - name: Build Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: flask-student-app
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .

      # 8. Push Docker image to ECR
      - name: Push Docker image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: flask-student-app
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      # 9. Deploy to EC2
      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: flask-student-app
          IMAGE_TAG: ${{ github.sha }}
        run: |

          # Create temporary SSH key
          echo "$EC2_SSH_KEY" > ec2_key.pem
          chmod 600 ec2_key.pem

          # Deploy to EC2
          ssh -o StrictHostKeyChecking=no \
            -i ec2_key.pem \
            $EC2_USER@$EC2_HOST << EOF

            echo "Logging into Amazon ECR..."

            aws ecr get-login-password --region us-east-1 | \
              sudo docker login \
              --username AWS \
              --password-stdin $ECR_REGISTRY

            echo "Pulling new Docker image..."

            sudo docker pull \
              $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

            echo "Stopping old Flask container..."

            sudo docker stop flask-student-app || true

            echo "Removing old Flask container..."

            sudo docker rm flask-student-app || true

            echo "Starting new Flask container..."

            sudo docker run -d \
              --name flask-student-app \
              --network flask-network \
              --restart unless-stopped \
              -p 5000:5000 \
              -e MONGO_URI="mongodb://mongodb:27017/student_db" \
              -e SECRET_KEY="flask-production-secret" \
              $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

            echo "Deployment completed."

            sudo docker ps

          EOF

          # Remove temporary SSH key
          rm -f ec2_key.pem
      notify:
    name: Send Deployment Notification
    needs: build-test-push
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Send Success Email
        if: needs.build-test-push.result == 'success'
        run: |
          aws sns publish \
            --topic-arn "arn:aws:sns:us-east-1:457660516966:flask-student-deployment" \
            --subject "SUCCESS: Flask Student App Deployment" \
            --message "Deployment successful.

          Repository: ${{ github.repository }}
          Branch: ${{ github.ref_name }}
          Commit: ${{ github.sha }}
          Workflow: ${{ github.workflow }}
          Run: ${{ github.run_number }}

          The Flask application was successfully tested, built, pushed to Amazon ECR, and deployed to EC2."

      - name: Send Failure Email
        if: needs.build-test-push.result == 'failure'
        run: |
          aws sns publish \
            --topic-arn "arn:aws:sns:us-east-1:457660516966:flask-student-deployment" \
            --subject "FAILED: Flask Student App Deployment" \
            --message "Deployment FAILED.

          Repository: ${{ github.repository }}
          Branch: ${{ github.ref_name }}
          Commit: ${{ github.sha }}
          Workflow: ${{ github.workflow }}
          Run: ${{ github.run_number }}

          Please check the GitHub Actions workflow logs to identify the failed step."